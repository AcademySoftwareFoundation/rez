name: getting started
on:
  pull_request:
    paths:
      - 'docs/source/getting_started.rst'
      - 'example_packages/**'
      - 'install.py'
      - 'src/rez/bind/**'
      - 'src/rezplugins/build_system/custom.py'
      - '.github/workflows/getting_started.yaml'
  push:
    paths:
      - 'docs/source/getting_started.rst'
      - 'example_packages/**'
      - 'install.py'
      - 'src/rez/bind/**'
      - 'src/rezplugins/build_system/custom.py'
      - '.github/workflows/getting_started.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']

        include:
        # ubuntu
        - os: ubuntu-latest
          rez-path: /installdir/bin/rez
        # macOS
        - os: macos-latest
          rez-path: /installdir/bin/rez
        # windows
        - os: windows-latest
          rez-path: \installdir\Scripts\rez

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install rez
      run: python ./install.py ./installdir

    - name: Setup environment variables
      shell: bash
      env:
        _GH_REZ_INSTALL_PATH: ${{ github.workspace }}${{ matrix.rez-path }}
      run: |
        echo "$_GH_REZ_INSTALL_PATH" >> $GITHUB_PATH

    - name: rez-status
      run: rez-status

    - name: Bind os, platform and arch
      run: rez-bind os

    - name: Bind python
      run: rez-bind python

    - name: Resolve an environment containing python (unix)
      if: ${{ !startsWith(matrix.os, 'windows-') }}
      shell: bash
      run: |
        set -eux
        rez-env python -- python --version | grep -q '^Python 3'

    - name: Resolve an environment containing python (windows)
      if: ${{ startsWith(matrix.os, 'windows-') }}
      shell: pwsh
      run: |
        $output = rez-env python -- python --version
        if ($output -notmatch '^Python 3') { throw "Unexpected output: [$output]" }

    - name: Build and install hello_world
      working-directory: ./example_packages/hello_world
      run: rez-build --install

    - name: Run the hello tool (unix)
      if: ${{ !startsWith(matrix.os, 'windows-') }}
      shell: bash
      run: |
        set -eux
        output=$(rez-env hello_world -- hello)
        test "$output" = "Hello world!"

    - name: Run the hello tool (windows)
      if: ${{ startsWith(matrix.os, 'windows-') }}
      shell: pwsh
      run: |
        $output = rez-env hello_world -- hello
        if ($output -ne 'Hello world!') { throw "Unexpected output: [$output]" }
